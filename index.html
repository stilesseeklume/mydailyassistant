<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Daily Assistant · 我的日常小工具</title>
<script>(function(){var t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<style>
  :root{
    --bg:#f5f5f7; --surface:#fff; --surface-2:#f0f0f2; --border:#e5e5ea;
    --text:#1d1d1f; --text-2:#6e6e73; --accent:#0071e3; --accent-bg:#f0f7ff;
    --shadow:0 1px 3px rgba(0,0,0,.06); --shadow-lg:0 8px 24px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#1c1c1e; --surface:#2c2c2e; --surface-2:#3a3a3c; --border:#3a3a3c;
    --text:#f5f5f7; --text-2:#98989d; --accent:#409cff; --accent-bg:rgba(64,156,255,.15);
    --shadow:0 1px 3px rgba(0,0,0,.3); --shadow-lg:0 8px 24px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:48px 20px 80px;}
  header.top{margin-bottom:8px;}
  .brand{font-size:28px;font-weight:800;letter-spacing:-.02em;}
  .sub{color:var(--text-2);margin:8px 0 0;font-size:15px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:32px;}
  a.card{display:block;background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:20px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;}
  a.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
  .icon{width:44px;height:44px;border-radius:12px;background:var(--accent-bg);color:var(--accent);
    display:flex;align-items:center;justify-content:center;font-size:24px;}
  .card h2{font-size:17px;margin:14px 0 6px;font-weight:700;}
  .card p{font-size:13px;color:var(--text-2);margin:0;line-height:1.6;}
  .foot{margin-top:40px;color:var(--text-2);font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">My Daily Assistant</div>
    <p class="sub">个人日常小工具集合 · 所有数据本地处理，不上传服务器</p>
  </header>
  <div class="grid">
    <a class="card" href="./hall-seating/">
      <div class="icon">🏛</div>
      <h2>礼堂排座</h2>
      <p>填班级和人数 · 班级聚集第一 · 领导席/颁奖席预留 · 平面图/指引单/Excel</p>
    </a>
    <a class="card" href="./score-analysis/">
      <div class="icon">🧪</div>
      <h2>成绩单转换</h2>
      <p>上传 Excel 成绩单 · 自动识别板块 · 120→130 换算 · 合并听说算总分</p>
    </a>
    <a class="card" href="./exam-seats/">
      <div class="icon">🎓</div>
      <h2>考试排座</h2>
      <p>大型考试自动排考场 · 物理/历史类 · 外语分语种 · 校验冲突 · 导出 Excel</p>
    </a>
  </div>
  <p class="foot">起于一个想法 · 随用随加</p>
</div>
</body>
</html>
